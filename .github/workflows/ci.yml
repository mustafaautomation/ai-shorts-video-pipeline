name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: Lint, test, and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install the package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Tests and evals
        run: pytest
      - name: Keyless end-to-end render
        run: >
          shorts-pipeline run
          --topic "Explain a hard idea in one short"
          --script-provider offline
          --voice-provider offline
          --publish
          --out out/sample-reel.mp4
      - name: Upload the sample reel
        uses: actions/upload-artifact@v4
        with:
          name: sample-reel
          path: |
            out/sample-reel.mp4
            out/publish/**/*.json
          if-no-files-found: error

  web:
    name: Build the Vercel demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

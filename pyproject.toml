[project]
name = "ai-shorts-video-pipeline"
version = "0.1.0"
description = "Portfolio demo: turn a topic into a captioned vertical reel and a mock publish payload."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mustafa" }]
license = { text = "MIT" }
dependencies = [
  "edge-tts>=6.1.19",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shorts-pipeline = "shorts_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shorts_pipeline"]
